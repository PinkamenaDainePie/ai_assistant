# 轻量服务器仅部署 Next.js 前端（约 200–400MB 内存）
# 后端 api / salvage 请部署到 CloudBase 云托管，在本目录 .env 中配置公网域名。
#
# 用法：
#   docker compose -f docker-compose.frontend.yml up --build -d

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://127.0.0.1:8000}
        # 生产环境勿设 NEXT_PUBLIC_*，由浏览器走 Next 同源反代
    image: ai-assistant-web:local
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL}
      MING_SALVAGE_PROXY_URL: ${MING_SALVAGE_PROXY_URL}
    restart: unless-stopped
