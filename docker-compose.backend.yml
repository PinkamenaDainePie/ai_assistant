# 轻量服务器仅部署后端：主 API + Salvage 引擎（无 Neo4j、无前端）
# 用法：docker compose -f docker-compose.backend.yml up --build -d

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PYTHON_VERSION: "3.11"
    image: ai-assistant-api:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TUTOR_USE_NEO4J: "0"
    restart: unless-stopped

  salvage:
    build:
      context: .
      dockerfile: Dockerfile.salvage
      args:
        PYTHON_VERSION: "3.11"
    image: ai-assistant-salvage:local
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${DASHSCOPE_API_KEY}
      OPENAI_BASE_URL: ${DASHSCOPE_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MING_SIM_USER_DATA_DIR: /data
    volumes:
      - ming_sim_data:/data
    restart: unless-stopped

volumes:
  ming_sim_data:
