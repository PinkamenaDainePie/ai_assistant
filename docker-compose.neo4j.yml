# 仅启动 Neo4j（供 AI 助教 GraphRAG 使用）
# 用法（需已安装 Docker Desktop）：
#   docker compose -f docker-compose.neo4j.yml up -d
#   python -m tutor_module.seed
#
# 浏览器管理界面：http://localhost:7474
# Bolt：bolt://127.0.0.1:7687
# 默认账号 neo4j / ai_assistant_neo4j（与 .env 一致）

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: ai-assistant-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ai_assistant_neo4j
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
